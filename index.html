<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Key Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0a0f;
    --bg-2:#12121a;
    --accent:#8b5cf6;
    --accent-2:#a78bfa;
    --accent-glow:rgba(139,92,246,.35);
    --text:#e5e7eb;
    --text-dim:#94a3b8;
    --border:rgba(255,255,255,.08);
    --card:rgba(20,20,28,.65);
    --success:#22c55e;
    --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg-1);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* Animated background */
  body::before{
    content:'';
    position:absolute;
    inset:-50%;
    background:
      radial-gradient(circle at 20% 30%, rgba(139,92,246,.18), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(59,130,246,.14), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(168,85,247,.08), transparent 60%);
    animation:float 20s ease-in-out infinite;
    z-index:0;
  }
  body::after{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 70%);
    z-index:0;
    pointer-events:none;
  }
  @keyframes float{
    0%,100%{transform:translate(0,0) rotate(0deg)}
    50%{transform:translate(-3%,3%) rotate(3deg)}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    background:var(--card);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid var(--border);
    border-radius:24px;
    padding:36px 32px 28px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.02),
      0 30px 60px -20px rgba(0,0,0,.7),
      0 0 80px -20px var(--accent-glow);
    animation:enter .6s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes enter{
    from{opacity:0;transform:translateY(20px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(139,92,246,.1);
    border:1px solid rgba(139,92,246,.25);
    font-size:11px;
    font-weight:600;
    color:var(--accent-2);
    letter-spacing:.5px;
    text-transform:uppercase;
    margin-bottom:16px;
  }
  .badge::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 8px var(--success);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.4}
  }

  h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.02em;
    margin-bottom:6px;
    background:linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .sub{
    font-size:13.5px;
    color:var(--text-dim);
    line-height:1.5;
    margin-bottom:26px;
  }

  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-bottom:8px;
  }
  .select-wrap{
    position:relative;
  }
  select{
    width:100%;
    appearance:none;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 40px 12px 14px;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:all .2s;
    outline:none;
  }
  select:hover{border-color:rgba(139,92,246,.4);background:rgba(255,255,255,.05)}
  select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
  select option{background:#16161e;color:var(--text)}
  .select-wrap::after{
    content:'';
    position:absolute;
    right:16px;top:50%;
    width:8px;height:8px;
    border-right:2px solid var(--text-dim);
    border-bottom:2px solid var(--text-dim);
    transform:translateY(-70%) rotate(45deg);
    pointer-events:none;
  }

  .btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:.2px;
    cursor:pointer;
    transition:all .25s cubic-bezier(.2,.9,.3,1.2);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    position:relative;
    overflow:hidden;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), #6d28d9);
    color:#fff;
    box-shadow:0 10px 30px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .btn-primary:hover{
    transform:translateY(-1px);
    box-shadow:0 15px 40px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn-primary:active{transform:translateY(0)}
  .btn-primary:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
  }

  .key-box{
    margin-top:22px;
    padding:16px;
    background:rgba(0,0,0,.35);
    border:1px dashed rgba(139,92,246,.35);
    border-radius:14px;
    display:none;
    animation:enter .4s ease;
  }
  .key-box.show{display:block}
  .key-label{
    font-size:11px;
    font-weight:600;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.6px;
    margin-bottom:8px;
  }
  .key-value{
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:700;
    color:var(--accent-2);
    letter-spacing:1.5px;
    word-break:break-all;
    line-height:1.5;
    margin-bottom:12px;
  }
  .key-meta{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-dim);
    padding-top:10px;
    border-top:1px solid var(--border);
    margin-bottom:12px;
  }
  .key-meta b{color:var(--text);font-weight:600}
  .btn-copy{
    background:rgba(139,92,246,.15);
    color:var(--accent-2);
    border:1px solid rgba(139,92,246,.3);
    padding:10px;
    border-radius:10px;
    font-size:13px;
  }
  .btn-copy:hover{background:rgba(139,92,246,.25)}
  .btn-copy.copied{background:rgba(34,197,94,.15);color:#4ade80;border-color:rgba(34,197,94,.3)}

  .footer{
    margin-top:20px;
    text-align:center;
    font-size:11.5px;
    color:var(--text-dim);
    letter-spacing:.3px;
  }
  .footer a{color:var(--accent-2);text-decoration:none;font-weight:600}
  .footer a:hover{text-decoration:underline}

  /* Ad gate overlay */
  .gate{
    position:fixed;
    inset:0;
    z-index:10;
    background:rgba(10,10,15,.92);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .gate.show{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .gate-card{
    max-width:400px;
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.8);
  }
  .gate-icon{
    width:56px;height:56px;
    border-radius:16px;
    background:linear-gradient(135deg, var(--accent), #6d28d9);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    font-size:26px;
    box-shadow:0 10px 30px -8px var(--accent-glow);
  }
  .gate h2{font-size:18px;font-weight:700;margin-bottom:8px}
  .gate p{font-size:13.5px;color:var(--text-dim);line-height:1.5;margin-bottom:20px}

  .timer{
    margin-top:14px;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .timer b{color:var(--accent-2)}

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:rgba(30,30,42,.95);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 20px;
    border-radius:12px;
    font-size:13.5px;
    font-weight:500;
    box-shadow:0 20px 40px -10px rgba(0,0,0,.6);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
    z-index:100;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast::before{
    content:'';
    width:8px;height:8px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 10px var(--success);
  }

  @media (max-width:420px){
    .card{padding:28px 22px 22px;border-radius:20px}
    h1{font-size:22px}
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">Generator Online</div>
  <h1>Key Generator</h1>
  <p class="sub">Generate a license key for your application. Keys are signed and self-validating.</p>

  <div class="field">
    <label>Duration</label>
    <div class="select-wrap">
      <select id="duration">
        <option value="1">1 Day</option>
        <option value="7" selected>7 Days</option>
        <option value="30">30 Days</option>
        <option value="90">90 Days</option>
        <option value="365">1 Year</option>
      </select>
    </div>
  </div>

  <button class="btn btn-primary" id="genBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
    Generate Key
  </button>

  <div class="key-box" id="keyBox">
    <div class="key-label">Your Key</div>
    <div class="key-value" id="keyValue">—</div>
    <div class="key-meta">
      <span>Expires: <b id="keyExpiry">—</b></span>
      <span>Type: <b id="keyDur">—</b></span>
    </div>
    <button class="btn btn-copy" id="copyBtn">Copy to Clipboard</button>
  </div>

  <div class="footer">
    Need support? <a href="https://t.me/NiggaIsHereFuck" target="_blank" rel="noopener">Join Channel</a>
  </div>
</div>

<!-- Ad gate overlay -->
<div class="gate" id="adGate">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h2>Verify to Continue</h2>
    <p>Complete a quick step to unlock your key.</p>
    <button class="btn btn-primary" id="adBtn">
      Unlock Now
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
    <div class="timer" id="gateTimer"></div>
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script>

const SECRET = 0x5A17C0DE;

function toHex(n, len){
  return n.toString(16).toUpperCase().padStart(len,'0').slice(-len);
}

function checksum(str){
  let h = SECRET >>> 0;
  for (let i = 0; i < str.length; i++){
    h = ((h << 5) - h + str.charCodeAt(i)) >>> 0;
  }
  return h;
}

function generateKey(days){
  const now = Math.floor(Date.now()/1000);
  const expiry = now + days * 86400;
  const expiryHex = toHex(expiry, 8);              // 8 hex chars (unix ts)
  const durHex = toHex(days, 4);                   // 4 hex chars
  const payload = expiryHex + durHex;
  const cs = toHex(checksum(payload + SECRET), 8); // 8 hex chars
  const rand = toHex(Math.floor(Math.random()*0xFFFFFFFF), 8);
  const raw = (payload + cs + rand).toUpperCase();
  const groups = raw.match(/.{1,4}/g);
  return 'KZ-' + groups.join('-');
}

const AD_LINK = 'https://shrinkme.click/u2GAQT';
const AD_WAIT = 5;

let unlocked = false;
let countdownInterval = null;

function showGate(){
  if (unlocked) return false;
  const gate = document.getElementById('adGate');
  gate.classList.add('show');
  return true;
}

document.getElementById('adBtn').addEventListener('click', () => {
  window.open(AD_LINK, '_blank');

  let remaining = AD_WAIT;
  const timerEl = document.getElementById('gateTimer');
  const btn = document.getElementById('adBtn');
  btn.disabled = true;

  clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    remaining--;
    if (remaining > 0){
      timerEl.innerHTML = 'Please wait <b>' + remaining + 's</b>...';
    } else {
      clearInterval(countdownInterval);
      timerEl.innerHTML = '<b>Verified!</b>';
      setTimeout(() => {
        unlocked = true;
        document.getElementById('adGate').classList.remove('show');
        btn.disabled = false;
        timerEl.innerHTML = '';
      }, 400);
    }
  }, 1000);

  timerEl.innerHTML = 'Please wait <b>' + remaining + 's</b>...';
});
document.getElementById('genBtn').addEventListener('click', () => {
  if (showGate()) return;

  const days = parseInt(document.getElementById('duration').value);
  const key = generateKey(days);
  const expiryDate = new Date(Date.now() + days * 86400 * 1000);

  document.getElementById('keyValue').textContent = key;
  document.getElementById('keyExpiry').textContent =
    expiryDate.toISOString().split('T')[0];
  document.getElementById('keyDur').textContent =
    days + (days === 1 ? ' Day' : ' Days');
  document.getElementById('keyBox').classList.add('show');
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.classList.remove('copied');
  copyBtn.textContent = 'Copy to Clipboard';
});

document.getElementById('copyBtn').addEventListener('click', async function(){
  const key = document.getElementById('keyValue').textContent;
  if (!key || key === '—') return;

  try{
    await navigator.clipboard.writeText(key);
  } catch {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = key;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  this.classList.add('copied');
  this.textContent = '✓ Copied!';
  showToast('Key copied to clipboard');

  setTimeout(() => {
    this.classList.remove('copied');
    this.textContent = 'Copy to Clipboard';
  }, 2000);
});

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
